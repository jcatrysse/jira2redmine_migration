# Test: Redmine 7.0 behind Apache + Passenger with X-Sendfile (plan, large attachment protocol).
Listen 8070
<VirtualHost *:8070>
    ServerName localhost
    DocumentRoot /home/user/src/redmine70/public
    PassengerRuby /opt/rbenv/versions/3.3.6/bin/ruby
    PassengerAppEnv production
    PassengerAppRoot /home/user/src/redmine70
    PassengerUser root
    # Uploads: allow the largest attachment (4 GiB) and give slow uploads time.
    LimitRequestBody 4294967296
    TimeOut 600
    # Downloads: Rails hands the file to Apache (X-Sendfile); Apache serves it, with range requests.
    XSendFile On
    XSendFilePath /home/user/src/redmine70/files
    SetEnv REDMINE_X_SENDFILE_HEADER X-Sendfile
    <Directory /home/user/src/redmine70/public>
        Require all granted
        Options -MultiViews
    </Directory>
</VirtualHost>
